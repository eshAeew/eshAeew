<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowIndigo" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -1.5px;
      fill: url(#textGrad);
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 2.5px;
      fill: #a5b4fc;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .status-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #34d399;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs -->
  <rect width="1200" height="280" rx="16" fill="url(#glowIndigo)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glowPurple)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glowCyan)"/>

  <!-- Outer Sleek Border -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Top Decorative Bar -->
  <line x1="80" y1="36" x2="1120" y2="36" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(980, 24)">
    <rect width="140" height="24" rx="12" fill="rgba(6, 78, 59, 0.3)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="15.5" class="status-text">SYSTEM ONLINE</text>
  </g>

  <!-- Terminal Style Dots (Top Left) -->
  <g transform="translate(80, 29)">
    <circle cx="6" cy="6" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="22" cy="6" r="4.5" fill="#eab308" opacity="0.8"/>
    <circle cx="38" cy="6" r="4.5" fill="#22c55e" opacity="0.8"/>
  </g>

  <!-- Role Badge -->
  <g transform="translate(80, 72)">
    <rect width="320" height="26" rx="6" fill="url(#badgeGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
    <text x="14" y="17" class="badge-text">CREATIVE TECHNOLOGIST &amp; AI ARCHITECT</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="162" class="brand-title">eshAeew</text>

  <!-- Subtitle Tagline -->
  <text x="80" y="202" class="tagline">Autonomous AI Systems  •  120fps WebGL Shaders &amp; Canvas  •  Kinetic UI  •  Full-Stack &amp; Android</text>

  <!-- Bottom Interactive Waveform Geometry -->
  <g opacity="0.35">
    <path d="M 80 240 Q 220 220, 360 240 T 640 240 T 920 240 T 1120 240" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 80 244 Q 220 230, 360 244 T 640 244 T 920 244 T 1120 244" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
  </g>

  <!-- Decorative Constellation Dots -->
  <circle cx="1060" cy="130" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="1110" cy="165" r="2" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="1030" cy="185" r="1.5" fill="#a5b4fc" opacity="0.5"/>
  <line x1="1060" y1="130" x2="1110" y2="165" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
  <line x1="1110" y1="165" x2="1030" y2="185" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
</svg>
